<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>La Foire de Liège</title>
<!--
  GABARIT applis élèves de Ludo (@rprof_1) — styles « Couleurs » (doux et illustré) et « Simple » (charte rprof1.com)
  À adapter : APP (titre, version, source), CONTENU, ÉTAPES d'aide, écrans d'activité.
  Ne pas utiliser l'attribut data-theme pour la logique de l'appli (réservé au thème clair/sombre).
-->
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F8FB; --surface:#EEF1F6; --card:#FFFFFF; --ink:#1F2933; --muted:#5A6470; --line:#E0E5EC; --line-strong:#CDD5DF;
  --focus:#3466CC; --primary:#3466CC; --primary-ink:#FFFFFF;
  --ok:#1E7643; --ok-bg:#E3F5E9; --ok-strong:#2FA05C;
  --bad:#B42A20; --bad-bg:#FCE7E5; --bad-strong:#D9473B;
  --sel:#3466CC; --sel-bg:#E6EEFC;
  --p-blue:#DCE9FB; --p-lav:#E7E0FA; --p-peach:#FDE5D3; --p-mint:#DCF1E4; --p-yellow:#FAF0C8; --p-rose:#FADDE3; --p-teal:#D3EFEC; --p-gris:#E6EAF0; /* pastels FIXES : identiques en clair et en sombre, toujours avec --tile-ink */
  --lav-ink:#3C3489; --mint-ink:#27500A; --rose-ink:#72243E; --tile-ink:#1F2933;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13181E; --surface:#1F2630; --card:#1A2129; --ink:#ECF0F4; --muted:#A0ABB7; --line:#2C3540; --line-strong:#3A4552;
    --focus:#8AB4F8; --primary:#6F9BF0; --primary-ink:#0F141A;
    --ok:#6FD39A; --ok-bg:#1C3527; --bad:#FF8A80; --bad-bg:#3F201E; --sel:#8AB4F8; --sel-bg:#21324B;
  }
}
:root[data-theme="dark"]{
  --bg:#13181E; --surface:#1F2630; --card:#1A2129; --ink:#ECF0F4; --muted:#A0ABB7; --line:#2C3540; --line-strong:#3A4552;
  --focus:#8AB4F8; --primary:#6F9BF0; --primary-ink:#0F141A;
  --ok:#6FD39A; --ok-bg:#1C3527; --bad:#FF8A80; --bad-bg:#3F201E; --sel:#8AB4F8; --sel-bg:#21324B;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p{margin:0;font-weight:normal}
b,strong{font-weight:normal}

/* ---------- Structure ---------- */
#app{height:100%;display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:14px;padding:12px 16px}
.round{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.round svg{width:24px;height:24px}
#topCenter{min-width:0;display:flex;align-items:center;justify-content:center;gap:10px}
.ttl{font-size:17px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background-color .3s}
.segs i.on{background:var(--primary)}
.streak{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:16px;padding:4px 10px;border-radius:999px;background:var(--p-peach);color:var(--tile-ink);animation:pop .3s}
.streak svg{width:18px;height:18px}
#main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{zoom:var(--z,1);min-height:calc(100% / var(--z,1));max-width:720px;margin:0 auto;padding:8px 20px 28px;display:flex;flex-direction:column;gap:18px}
body.sheet-open .wrap{padding-bottom:220px}
.actions{margin-top:auto;padding-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.actions>*{flex:1 1 200px}
.actions.inline{margin-top:0;padding-top:0}
.home-bottom{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.enter{animation:enterR .28s ease-out}
@keyframes enterR{from{opacity:0;transform:translateX(28px)}}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- Textes ---------- */
h1{font-size:clamp(30px,5vw,40px);line-height:1.15;letter-spacing:-.015em}
.lead{font-size:20px;color:var(--muted)}
.q-label{font-size:22px;line-height:1.3}
.small-label{font-size:16px;color:var(--muted)}
.badge{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:15px;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--muted)}
.word{display:block;font-size:clamp(34px,6vw,46px);font-weight:bold;line-height:1.1}
.def{display:block;font-size:clamp(21px,3vw,24px);line-height:1.5}

/* ---------- Accueil ---------- */
.hero{display:flex;justify-content:flex-start;margin:4px 0 -6px}
.hero svg{width:min(240px,60%);height:auto}
.slines{display:flex;flex-direction:column;gap:10px}
.sline{display:flex;align-items:center;gap:14px;font-size:20px;line-height:1.35;text-align:left}
.sline .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--p-lav);display:flex;align-items:center;justify-content:center}
.sline .ic svg{width:28px;height:28px}
.field{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.field input{max-width:360px;min-height:54px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:20px Arial,Helvetica,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:156px;padding:18px;border-radius:26px;border:0;background:var(--c,var(--p-blue));color:var(--tile-ink);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ico{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center}
.tile .ico svg{width:46px;height:46px}
.tile .name{font-size:22px;margin-top:auto}
.tile .desc{font-size:16px;opacity:.8;line-height:1.35}
.sizes{display:flex;flex-direction:column;gap:8px}
.size-pills{display:flex;gap:8px;flex-wrap:wrap}
.size-pill{min-height:46px;padding:0 16px;border-radius:999px;border:0;background:var(--surface);font-size:16px;display:inline-flex;align-items:center;gap:6px}
.size-pill[aria-pressed="true"]{background:var(--sel-bg);box-shadow:inset 0 0 0 2px var(--sel)}
.foot{margin-top:8px;font-size:13px;line-height:1.6;color:var(--muted);text-align:left}

/* ---------- Boutons ---------- */
.btn{min-height:58px;padding:0 24px;border-radius:999px;border:0;background:var(--surface);font-size:19px;transition:transform .08s}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- Carte définition / question ---------- */
.def-card{display:flex;flex-direction:column;gap:12px;padding:22px 22px 24px;border-radius:24px;background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left}

/* ---------- Choix (un mot = pastille lavande) ---------- */
.answers{display:grid;gap:12px}
.choice{position:relative;min-height:60px;padding:14px 52px;border-radius:999px;border:2px solid transparent;background:var(--p-lav);color:var(--lav-ink);font-size:22px;text-align:center;transition:background-color .2s,border-color .2s,opacity .2s,transform .08s}
.choice:active:not(:disabled){transform:scale(.98)}
.choice:disabled{cursor:default;color:var(--lav-ink)}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.choice.ko{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.choice.ok::after,.choice.ko::after{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px}
.choice.ok::after{content:"✓";color:var(--ok)}
.choice.ko::after{content:"✗";color:var(--bad)}
.choice.dim{opacity:.45}
.choice.pop{animation:pop .3s}
.choice.shake{animation:shake .3s}
.choice.vf-yes{background:var(--p-mint);color:var(--mint-ink)}
.choice.vf-no{background:var(--p-rose);color:var(--rose-ink)}

/* ---------- Feuille de résultat (monte du bas) ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--ok-bg);transform:translateY(105%);visibility:hidden;transition:transform .28s ease-out,visibility 0s .28s}
.sheet.show{transform:none;visibility:visible;transition:transform .28s ease-out}
.sheet.bad{background:var(--bad-bg)}
.sheet-in{zoom:var(--z,1);max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-msg{display:flex;gap:14px;align-items:center}
.sheet-ico{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;background:var(--ok-strong)}
.sheet.bad .sheet-ico{background:var(--bad-strong)}
.sheet-title{font-size:24px;color:var(--ok)}
.sheet.bad .sheet-title{color:var(--bad)}
.sheet-sub{font-size:19px;margin-top:2px}
/* Bouton Continuer en ok / bad foncés (charte « Applis élèves » du 24/10/2026 : texte blanc à 5,6:1 et 6,4:1) */
.sheet-btn{min-height:60px;border-radius:999px;border:0;font-size:20px;color:#fff;background:var(--ok)}
.sheet.bad .sheet-btn{background:var(--bad)}
:root[data-theme="dark"] .sheet-btn{color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet-btn{color:var(--bg)}}
.sheet-btn:active{transform:scale(.98)}

/* ---------- Récapitulatif ---------- */
.recap{display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:30px;background:var(--card);border:1px solid var(--line)}
.recap-head{display:flex;align-items:center;gap:18px}
.ring{flex:none;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--ok-strong) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center}
.ring span{width:80px;height:80px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;font-size:17px;color:var(--tile-ink)}
.chip.ok{background:var(--p-mint)} .chip.ko{background:var(--p-rose)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:22px;background:var(--p-yellow);color:var(--tile-ink);font-size:19px}
.tip svg{flex:none;width:34px;height:34px}

/* ---------- Aide pas-à-pas ---------- */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(31,41,51,.28)}
.modal.on{display:flex}
.mbox{zoom:var(--z,1);width:min(620px,100%);max-height:calc(100% / var(--z,1));overflow:auto;background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px}
.mtop{display:flex;align-items:center;gap:12px}
.mtop .segs{flex:1}
.mbox h2{font-size:26px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav .btn{min-width:130px}
.scount{font-size:16px;color:var(--muted)}

/* Réglages en haut de l'accueil (Style + Taille du texte) */
.reglages{display:flex;flex-wrap:wrap;gap:12px 28px;padding-bottom:4px}
.reglages .size-pill{min-height:44px}
body.simple .hero{display:none}
body.simple .tile{background:var(--surface)!important;border:0}
body.simple .tile .ico{background:#FFFFFF}
body.simple .sline .ic{background:var(--surface)}
body.simple .size-pill[aria-pressed="true"]{color:#FFFFFF;box-shadow:none}
body.simple .def-card{background:#FFFFFF;border:1.5px solid var(--line)}
body.simple .badge,body.simple .tip{background:var(--surface)}
/* Tuile désactivée : le fond reste plein, seul le contenu pâlit (lisible en clair comme en sombre) */
.tile:disabled{cursor:default}
.tile:disabled .ico,.tile:disabled .name,.tile:disabled .desc{opacity:.7}
/* Encadré neutre : fond qui suit le thème, donc texte en --ink (jamais --tile-ink) */
.tip.neutre{background:var(--surface);color:var(--ink)}
body.simple .choice:not(.ok):not(.ko):not(.dim){background:var(--surface)}
body.simple .segs i.on{background:#0A0A0A}
/* Étiquette « Nouveau » à côté du bouton Simple (couleurs fixes, lisibles en clair et en sombre) */
.nouveau{margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;line-height:1.6;background:#FAF0C8;color:#1F2933}
/* Ouverture façon rprof1.com : le titre, puis le point tombe, rebondit et se pose (≈ 1,5 s). */
.ouverture{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.ouverture-mot{max-width:14ch;text-align:center;font-family:"Figtree","Avenir Next",Arial,sans-serif;font-size:clamp(44px,9vw,92px);font-weight:600;letter-spacing:-.045em;line-height:1.02;color:var(--ink)}
.ouverture-point{display:inline-block;transform-origin:50% 85%}
@media (prefers-reduced-motion:reduce){
  .enter,.choice.pop,.choice.shake,.streak{animation:none}
  .sheet,.segs i,.tile,.choice{transition:none}
}
/* Style « Simple » = charte de rprof1.com : blanc, noir, gris, une seule police (Figtree, incluse).
   Restent en couleur : les pictogrammes (dans un rond blanc), les mots en évidence,

body.simple{
  --bg:#FFFFFF; --surface:#F7F7F7; --card:#FFFFFF; --ink:#0A0A0A; --muted:#737373; --line:#ECECEC; --line-strong:#DCDCDC;
  --focus:#0A0A0A; --primary:#0A0A0A; --primary-ink:#FFFFFF; --sel:#0A0A0A; --sel-bg:#0A0A0A;
  --p-lav:#F7F7F7; --lav-ink:#0A0A0A; --tile-ink:#0A0A0A;
  --ok:#1A7F37; --ok-bg:#E3F5E9; --ok-strong:#1A7F37; --bad:#B42318; --bad-bg:#FCE7E5; --bad-strong:#B42318;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  background:#FFFFFF;color:var(--ink);font-family:"Figtree","Avenir Next",Arial,sans-serif;
  color-scheme:light;
}
body.simple .field input{font-family:inherit}
body.simple h1{font-weight:600;letter-spacing:-.045em;line-height:1}
body.simple .mbox h2,body.simple .sheet-title,body.simple .word{font-weight:600;letter-spacing:-.025em}
body.simple .tile .name{font-weight:600;letter-spacing:-.02em}
body.simple .lead{color:#3C3C3C}
body.simple .hero{display:none}
body.simple .round{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .tile{background:var(--surface)!important;border:0;border-radius:16px}
body.simple .tile .ico{background:#FFFFFF}
body.simple .sline .ic{background:var(--surface)}
body.simple .badge,body.simple .scount,body.simple .foot{font-family:var(--mono);letter-spacing:.03em}
body.simple textarea,body.simple input,body.simple select{font-family:inherit}
body.simple .badge{background:transparent;border:1px solid var(--line-strong);font-size:14px}
body.simple .size-pill{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .size-pill[aria-pressed="true"]{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF;box-shadow:none}
body.simple .btn{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .btn.primary{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF}
body.simple .def-card,body.simple .recap{background:#FFFFFF;border:1px solid var(--line);border-radius:16px}
body.simple .choice:not(.ok):not(.ko):not(.dim),body.simple .choice.dim:not(.ok):not(.ko){background:#FFFFFF;border:1px solid var(--line-strong);color:var(--ink)}
body.simple .choice.ok,body.simple .choice.ko{border-width:2px}
body.simple .tip{background:var(--surface);border-radius:16px}
body.simple .chip.ok{background:var(--ok-bg);color:var(--ok)} body.simple .chip.ko{background:var(--bad-bg);color:var(--bad)}


body.simple .segs i{height:4px} body.simple .segs i.on{background:#0A0A0A}
body.simple .mbox{border-radius:16px}
body.simple .modal{background:rgba(10,10,10,.25)}
/* Réponses en pastel : contours et rond dans les pastels du site, bouton Continuer noir. */
body.simple .choice.ok{border-color:#86CFA4} body.simple .choice.ko{border-color:#F4A3B4}
body.simple .sheet-ico{background:#86CFA4;color:#0A0A0A} body.simple .sheet.bad .sheet-ico{background:#F4A3B4}
body.simple .sheet-btn,body.simple .sheet.bad .sheet-btn{background:#0A0A0A;color:#FFFFFF}
body.simple .streak{background:var(--surface);color:var(--ink)}
.top{position:relative}
.marque{position:absolute;left:16px;top:50%;transform:translateY(-50%);margin:0;font-family:"Figtree","Avenir Next",Arial,sans-serif;font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--ink);pointer-events:none}
/* ---------- La Foire de Liège ---------- */
.cle{font-weight:bold}
.wrap.large{max-width:1000px}
/* Scrollytelling : la scène reste en place, le texte se colle dessous pendant que la scène s'anime */
.sc-mode{margin-bottom:2px}
.scrolly{display:flex;flex-direction:column}
.sc-visu{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 12px}
.scene{position:relative;width:100%;height:var(--sceneh,300px);border-radius:28px;background:var(--c,var(--p-yellow));overflow:hidden;transition:background-color .4s}
.sc-svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;pointer-events:none}
.sc-svg.on{opacity:1;visibility:visible;transition:opacity .35s;pointer-events:auto}

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(APP.cle+'-'+k));}localStorage.setItem(APP.cle+'-'+k,JSON.stringify(v));}catch(e){return null;}}

/* Tirage sans répétition : la banque est épuisée avant de reproposer une question */
function pioche(n){let reste=store('reste');if(!Array.isArray(reste))reste=[];reste=reste.filter(i=>i<QUESTIONS.length);if(!reste.length)reste=shuffle(QUESTIONS.map((_,i)=>i));
  const pris=[];while(pris.length<n){if(!reste.length)reste=shuffle(QUESTIONS.map((_,i)=>i).filter(i=>pris.indexOf(i)<0));if(!reste.length)break;pris.push(reste.shift());}
  store('reste',reste);return pris.map(i=>QUESTIONS[i]);}

const synth=window.speechSynthesis||null;
function say(t){if(!synth||!t)return;try{synth.cancel();const u=new SpeechSynthesisUtterance(t);const v=synth.getVoices();const fr=v.find(x=>/fr[-_]BE/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang));u.lang=fr?fr.lang:'fr-FR';if(fr)u.voice=fr;u.rate=.9;synth.speak(u);}catch(e){}}

/* Style mémorisé sur l'iPad : 'couleurs' (par défaut) ou 'simple' (épuré). Classe sur body, jamais data-theme. */
function styleActuel(){return store('style')==='simple'?'simple':'couleurs';}

/* Ouverture façon rprof1.com : le titre s'affiche, le point tombe, rebondit en changeant
   de couleur (pastels du site) et se pose. Une fois par session, sautée au toucher,
   jamais si l'iPad demande moins d'animations ni pendant les tests automatiques. */
function ouverture(){
  let vu=null;try{vu=sessionStorage.getItem(APP.cle+'-ouverture');sessionStorage.setItem(APP.cle+'-ouverture','1');}catch(e){}
  if(vu||!('animate' in Element.prototype)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(navigator.webdriver&&location.hash!=='#ouverture')return;
  const o=document.createElement('div');o.className='ouverture';o.setAttribute('aria-hidden','true');
  o.innerHTML='<span class="ouverture-mot">'+esc(APP.titre)+'<span class="ouverture-point">.</span></span>';
  document.body.appendChild(o);
  const p=o.querySelector('.ouverture-point');let fini=false;
  const fermer=()=>{if(fini)return;fini=true;o.animate([{opacity:1},{opacity:0}],{duration:280,fill:'forwards'}).finished.then(()=>o.remove());};
  ['pointerdown','keydown'].forEach(t=>addEventListener(t,fermer,{once:true,passive:true}));
  const bas='cubic-bezier(.5,0,1,.6)',haut='cubic-bezier(0,.4,.5,1)';
  p.animate([
    {transform:'translateY(-1.7em) scale(.9,1.15)',opacity:0,color:'#B9A7EE',offset:0},
    {transform:'translateY(-1.7em) scale(.9,1.15)',opacity:1,easing:bas,offset:.02},
    {transform:'translateY(0) scale(.9,1.15)',color:'#8FB6EE',offset:.34},
    {transform:'translateY(0) scale(1.35,.68)',easing:haut,offset:.40},
    {transform:'translateY(-.45em) scale(.95,1.08)',color:'#86CFA4',easing:bas,offset:.58},
    {transform:'translateY(0) scale(1.25,.78)',easing:haut,offset:.70},
    {transform:'translateY(-.14em) scale(1,1)',color:'#E9C95E',easing:bas,offset:.80},
    {transform:'translateY(0) scale(1.1,.9)',color:'#F4A3B4',offset:.88},
    {transform:'translateY(0) scale(1,1)',color:getComputedStyle(p).color,offset:1}
  ],{duration:1150,fill:'backwards'});
  setTimeout(fermer,1400);
}

const NOUVEAU_SIMPLE=(()=>{const n=store('nouveau-simple')||0;if(n>=0&&n<3)store('nouveau-simple',n+1);return n>=0&&n<3;})();

/* ---------- A. Tirage sans répétition, par liste ----------
   cle : nom de la liste (ex. 'trier-2-ferme'), ids : identifiants possibles, n : nombre voulu.
   La liste est épuisée avant de reproposer un identifiant ; les identifiants disparus
   (contenu modifié dans une nouvelle version) sont ignorés. */
function piocheIds(cle,ids,n){
  let reste=store('reste-'+cle);if(!Array.isArray(reste))reste=[];
  reste=reste.filter(id=>ids.indexOf(id)>=0);
  const pris=[];
  while(pris.length<n&&pris.length<ids.length){
    if(!reste.length)reste=shuffle(ids.filter(id=>pris.indexOf(id)<0));
    pris.push(reste.shift());
  }
  store('reste-'+cle,reste);
  return pris;
}

/* ---------- E. Écran de résultat commun ----------
   res : {score, n, aRevoir:[textes], detail:'bonnes réponses' | 'du premier coup'}
   « Aucune erreur » seulement si score === n (test de cohérence obligatoire). */
function ecranResultat(res,rejouer,accueil){
  const n=res.n,sc=res.score,pc=n?Math.round(sc/n*100):0;
  const detail=res.detail==='du premier coup'?' du premier coup':(sc>1?' bonnes réponses':' bonne réponse');
  header({title:'Résultat',listen:()=>say('Tu as '+sc+detail+' sur '+n+'.')});
  view('<div class="recap"><div class="recap-head"><div class="ring" style="--p:'+pc+'"><span>'+sc+'/'+n+'</span></div>'+
    '<div><h1>'+(pc>=80?'Bravo':pc>=50?'Bien joué':'Continue')+' !</h1><p class="lead">'+sc+detail+' sur '+n+'.</p></div></div>'+
    (sc<n&&res.aRevoir.length?'<p class="small-label">À revoir</p><div class="chips">'+res.aRevoir.map(t=>'<span class="chip ko">'+esc(t)+'</span>').join('')+'</div>':'')+
    (sc===n?'<p class="small-label">Aucune erreur. Super !</p>':'')+
    '</div><div class="tip">'+ICONS.photo+'<span>Fais une capture d\u2019écran pour montrer ton travail.</span></div>'+
    '<div class="actions"><button type="button" class="btn primary" id="againBtn">Rejouer</button><button type="button" class="btn" id="homeBtn2">Accueil</button></div>');
  $('#againBtn').addEventListener('click',rejouer);
  $('#homeBtn2').addEventListener('click',accueil);
}

/* ---------- 1. Je découvre : récit animé au défilement (scrollytelling) ----------
   La scène reste en place (en haut en portrait, à gauche en paysage). Chaque partie
   a sa scène, qui avance avec le doigt (t de 0 à 1) ; le texte de la partie reste
   affiché pendant ce temps et ses phrases apparaissent l'une après l'autre.
   Texte complet par défaut, « Texte facile » (FALC) en option. */
if(navigator.webdriver)document.body.classList.add('sans-fondu');
function texteFacile(){return store('texte')==='facile';}
function lignes(p){return texteFacile()?p.l:p.t;}
const MOINS_ANIM=matchMedia('(prefers-reduced-motion: reduce)');
function renderDecouvrir(depart){
  S.scrolly={i:-1,t:-1};
  view('<div class="sizes sc-mode"><span class="small-label">Texte</span><div class="size-pills">'+[['complet','Texte complet'],['facile','Texte facile']].map(m=>'<button type="button" class="size-pill" data-texte="'+m[0]+'" aria-pressed="'+((texteFacile()?'facile':'complet')===m[0])+'">'+m[1]+'</button>').join('')+'</div></div>'+
    '<div class="scrolly">'+
      '<div class="sc-visu"><div class="scene" id="scene">'+PARTIES.map((p,k)=>p.video?
        '<div class="sc-svg sc-video" data-k="'+k+'"><div class="vcadre"><iframe data-src="https://www.youtube-nocookie.com/embed/'+p.video+'?playsinline=1&rel=0&enablejsapi=1" title="'+esc(p.titre)+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><p class="vsource">Vidéo : '+esc(p.source)+'. Il faut Internet.</p></div>':
        '<svg class="sc-svg" data-k="'+k+'" viewBox="0 0 400 300" aria-hidden="true">'+SCENES[p.sc].html()+'</svg>').join('')+
        '<svg class="sc-svg" data-k="'+PARTIES.length+'" viewBox="0 0 400 300" aria-hidden="true"><g transform="translate(110 40) scale(2.8)">'+ICONS.trophee.replace(/^<svg[^>]*>|<\/svg>$/g,'')+'</g></svg></div></div>'+
      '<div class="sc-steps">'+PARTIES.map((p,k)=>{const L=lignes(p);
        return '<section class="sc-step" data-k="'+k+'"><div class="def-card sc-card">'+
          '<span class="badge">Partie '+(k+1)+' sur '+PARTIES.length+'</span>'+
          '<h2 class="sc-titre">'+esc(p.titre)+'</h2>'+
          '<div class="sc-lignes'+(texteFacile()?' facile':'')+'">'+L.map((t,i)=>'<p data-i="'+i+'" data-n="'+L.length+'">'+gras(t)+'</p>').join('')+'</div>'+
          (p.d?'<div class="tip sc-def">'+ICONS.lire+'<span><b class="cle">'+esc(p.d[0])+'</b> : '+esc(p.d[1])+'</span></div>':'')+
          '<button type="button" class="btn sc-next" data-next="'+(k+1)+'">'+(k<PARTIES.length-1?ICONS.fleche+' Partie suivante':'J’ai tout lu')+'</button>'+
        '</div></section>';}).join('')+
        '<section class="sc-step sc-fin" data-k="'+PARTIES.length+'"><div class="def-card sc-card">'+
          '<h2 class="sc-titre">Bravo, tu as tout lu !</h2><p>Maintenant, réponds aux questions.</p>'+
          '<div class="actions inline"><button type="button" class="btn primary" id="toQuiz">Je réponds aux questions</button><button type="button" class="btn" id="toTop">Je relis depuis le début</button></div>'+
        '</div></section>'+
      '</div></div>');
  $$('.sc-next',main).forEach(b=>b.addEventListener('click',()=>allerA(Number(b.dataset.next))));
  $('#toQuiz').addEventListener('click',renderDefi);
  $('#toTop').addEventListener('click',()=>allerA(0));
  $$('[data-texte]',main).forEach(b=>b.addEventListener('click',()=>{const k=Math.max(0,S.scrolly.i);store('texte',b.dataset.texte);renderDecouvrir(k);}));
  layout();
  if(depart)allerA(depart,true);
  scrollyMaj();
}
/* Où le texte se colle : sous la scène en portrait, en haut en paysage */
function repere(){const r=main.getBoundingClientRect(),visu=$('.sc-visu',main);
  return document.body.classList.contains('portrait')&&visu?visu.getBoundingClientRect().bottom:r.top;}
function allerA(k,direct){const el=$('.sc-step[data-k="'+k+'"]',main);if(!el)return;
  const visu=$('.sc-visu',main),portrait=document.body.classList.contains('portrait');
  const decal=portrait&&visu?visu.getBoundingClientRect().height:0;
  const top=main.scrollTop+el.getBoundingClientRect().top-main.getBoundingClientRect().top-decal-8;
  main.scrollTo({top:Math.max(0,top),behavior:direct||MOINS_ANIM.matches?'auto':'smooth'});}
function scrollyMaj(){
  if(!S.scrolly)return;const steps=$$('.sc-step',main);if(!steps.length)return;
  const ref=repere(),bas=main.getBoundingClientRect().bottom;let k=0;
  steps.forEach((s,j)=>{if(s.getBoundingClientRect().top<=ref+(bas-ref)*.35)k=j;});
  if(main.scrollTop+main.clientHeight>=main.scrollHeight-4)k=steps.length-1;
  /* avancement de la partie : de son arrivée sous le repère jusqu'à sa sortie */
  const st=steps[k],rs=st.getBoundingClientRect(),carte=$('.sc-card',st).getBoundingClientRect();
  const course=Math.max(1,rs.height-carte.height-24);
  let t=clamp((ref+(bas-ref)*.35-rs.top)/course,0,1);
  if(MOINS_ANIM.matches||k>=PARTIES.length)t=1;
  const change=k!==S.scrolly.i;
  if(!change&&Math.abs(t-S.scrolly.t)<.002)return;
  S.scrolly.i=k;S.scrolly.t=t;
  if(change){
    /* vidéo : chargée quand on arrive sur sa partie, mise en pause quand on la quitte */
    $$('.sc-video iframe',main).forEach(f=>{const ici=f.closest('.sc-svg').dataset.k==String(k);
      if(ici&&!f.src)f.src=f.dataset.src;
      else if(!ici&&f.src)try{f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}','*');}catch(e){}});
    steps.forEach((s,j)=>s.classList.toggle('on',j===k));
    $$('.sc-svg',main).forEach(s=>s.classList.toggle('on',Number(s.dataset.k)===k));
    const fin=k>=PARTIES.length,p=PARTIES[Math.min(k,PARTIES.length-1)];
    $('#scene').style.setProperty('--c','var('+(fin?'--p-mint':p.c)+')');
    const lu=Number(store('lu'))||0;if(k+1>lu)store('lu',Math.min(k+1,PARTIES.length));
    header({segs:[Math.min(k+1,PARTIES.length),PARTIES.length],listen:()=>say(fin?'Bravo, tu as tout lu ! Maintenant, réponds aux questions.':p.titre+'. '+lignes(p).map(sansGras).join(' ')+(p.d?' '+p.d[0]+' : '+p.d[1]+'.':''))});
  }
  if(k<PARTIES.length){
    const sc=SCENES[PARTIES[k].sc];if(sc)sc.maj($('.sc-svg[data-k="'+k+'"]',main),t);
    /* les phrases apparaissent l'une après l'autre ; les parties déjà passées restent entières */
    $$('.sc-lignes p',st).forEach(p=>p.classList.toggle('vu',t>=Number(p.dataset.i)/Number(p.dataset.n)*.5));
  }
  steps.forEach((s,j)=>{if(j<k)$$('.sc-lignes p',s).forEach(p=>p.classList.add('vu'));});
}
main.addEventListener('scroll',()=>{if(S.scrolly)requestAnimationFrame(scrollyMaj);},{passive:true});

/* ---------- Je choisis mon défi : écran à part, juste avant les questions ---------- */
const DEFIS_TXT={'1':'La réponse est écrite dans le texte.','2':'Il faut relier 2 phrases.','3':'Il faut réfléchir.'};
function renderDefi(){
  S.scrolly=null;
  header({title:'Je comprends',listen:()=>say('Je choisis mon défi. '+DEFIS.map(d=>d[1]+' : '+NB_PAR_DEFI[d[0]]+' questions. '+DEFIS_TXT[d[0]]).join(' '))});
  view('<h1>Je choisis mon défi</h1>'+
    '<div class="tiles defis-tuiles">'+DEFIS.map((d,k)=>'<button type="button" class="tile" data-defi-go="'+d[0]+'" style="--c:var('+['--p-mint','--p-yellow','--p-peach'][k]+')"><span class="ico">'+ICONS.etoile.replace('<svg','<svg data-n="'+(k+1)+'"')+'</span><span class="name">'+d[1]+'</span><span class="desc">'+NB_PAR_DEFI[d[0]]+' questions. '+DEFIS_TXT[d[0]]+'</span></button>').join('')+'</div>'+
    '<div class="actions"><button type="button" class="btn" id="retourBtn">Accueil</button></div>');
  $$('[data-defi-go]',main).forEach(b=>b.addEventListener('click',()=>{store('defi',b.dataset.defiGo);startQuiz(false);}));
  $('#retourBtn').addEventListener('click',renderHome);
}

/* ---------- 2. Je comprends : questions à 3 choix (2 pour vrai ou faux) ---------- */
function startQuiz(diffMode){
  S.scrolly=null;
  let ids;
  if(diffMode){const d=difficiles();ids=QUESTIONS.filter(q=>d.indexOf('q:'+q.id)>=0).map(q=>q.id);if(!ids.length)return renderHome();ids=shuffle(ids).slice(0,10);}
  else{const def=defiActuel();ids=piocheIds('quiz-'+def+(texteFacile()?'-f':''),QUESTIONS.filter(q=>defiOk(q.n)&&!(q.c&&texteFacile())).map(q=>q.id),NB_PAR_DEFI[def]);}
  S.sess={qs:ids.map(id=>QUESTIONS.find(q=>q.id===id)),i:0,score:0,serie:0,ko:[],diff:diffMode};
  renderQuestion();
}
function renderQuestion(){
  const s=S.sess,q=s.qs[s.i],vf=q.f.length===1;
  header({segs:[s.i,s.qs.length],streak:s.serie,listen:()=>say(q.q)});
  const choix=vf?['Vrai','Faux']:shuffle([q.r].concat(q.f));
  window.__appli.bonneReponse=q.r; /* crochet pour les tests automatiques */
  view('<div class="def-card"><span class="badge">Question '+(s.i+1)+' sur '+s.qs.length+'</span><p class="q-label">'+esc(q.q)+'</p></div>'+
    '<div class="answers">'+choix.map(c=>'<button type="button" class="choice'+(vf?(c==='Vrai'?' vf-yes':' vf-no'):'')+'" data-rep="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>');
  $$('.choice',main).forEach(b=>b.addEventListener('click',()=>{
    const juste=b.dataset.rep===q.r,pi=PARTIES.findIndex(x=>x.id==='p'+q.p),p=PARTIES[pi],np=pi+1;
    $$('.choice',main).forEach(x=>{x.disabled=true;if(x.dataset.rep===q.r)x.classList.add('ok');else if(x!==b)x.classList.add('dim');});
    if(juste){b.classList.add('pop');s.score++;s.serie++;noterReussite('q:'+q.id);if(s.diff)retirerDifficile('q:'+q.id);}
    else{b.classList.add('ko','shake');s.serie=0;noterErreur('q:'+q.id);
      const t='Partie '+np+' : '+p.titre;if(s.ko.indexOf(t)<0)s.ko.push(t);}
    header({segs:[s.i+1,s.qs.length],streak:s.serie,listen:()=>say(q.q)});
    showSheet(juste,juste?'Bravo !':'Presque !',juste?'Tu as trouvé la bonne réponse.':'La bonne réponse est : '+q.r.replace(/\.$/,'')+(p.video?'. Revois la vidéo (partie '+np+').':'. Relis la partie '+np+' : '+p.titre+'.'),
      ()=>{s.i++;if(s.i<s.qs.length)renderQuestion();else ecranResultat({score:s.score,n:s.qs.length,aRevoir:s.ko},()=>startQuiz(s.diff),renderHome);});
  }));
}

/* ---------- 3. Je présente : fiche d'une attraction, étape par étape ---------- */
function fiche(){const f=store('fiche')||{};return {parc:f.parc||'',nom:f.nom||'',genre:f.genre||'',mots:Array.isArray(f.mots)?f.mots.filter(m=>MOTS.indexOf(m)>=0):[],pourquoi:f.pourquoi||'',plus:f.plus||'',fini:!!f.fini};}
function garder(f){store('fiche',f);}
const ETAPES_PROJET=[
  {titre:'Choisis un parc',ok:f=>f.parc.trim().length>0},
  {titre:'Choisis une attraction',ok:f=>f.nom.trim().length>0},
  {titre:'Quel genre d’attraction ?',ok:f=>!!f.genre},
  {titre:'Choisis 3 mots pour la décrire',ok:f=>f.mots.length>0},
  {titre:'Pourquoi tu l’as choisie ?',ok:f=>f.pourquoi.trim().length>0},
  {titre:'Une information en plus',ok:()=>true},
  {titre:'Comment présenter ?',ok:()=>true}
];
function renderProjet(i){
  S.scrolly=null;const f=fiche(),n=ETAPES_PROJET.length;
  if(i>=n)return renderFiche();
  const e=ETAPES_PROJET[i];
  let corps='',dit=e.titre+'.';
  if(i===0){dit+=' Écris le nom d’un parc. Ou touche une idée.';
    corps=line('lire','Écris le nom d’un parc. Ou touche une idée.')+
      '<input class="saisie" id="champ" type="text" maxlength="40" autocomplete="off" aria-label="Nom du parc" value="'+esc(f.parc)+'">'+
      '<div class="size-pills idees">'+PARCS.map(p=>'<button type="button" class="size-pill" data-idee="'+esc(p)+'" aria-pressed="'+(f.parc===p)+'">'+esc(p)+'</button>').join('')+'</div>';}
  else if(i===1){dit+=' Écris le nom de l’attraction.';
    corps=line('lire','Écris le nom de l’attraction.')+
      '<input class="saisie" id="champ" type="text" maxlength="40" autocomplete="off" aria-label="Nom de l’attraction" value="'+esc(f.nom)+'">'+
      '<div class="tip">'+ICONS.lire+'<span>Tu ne connais pas d’attraction ? Regarde le site Internet du parc avec ton professeur.</span></div>';}
  else if(i===2){dit+=' Touche une réponse.';
    corps='<div class="genres">'+GENRES.map(g=>'<button type="button" class="genre" data-genre="'+g[0]+'" aria-pressed="'+(f.genre===g[0])+'"><span class="gico">'+ICONS[g[0]]+'</span><span>'+esc(g[1])+'</span></button>').join('')+'</div>';}
  else if(i===3){dit+=' Touche 3 mots.';
    corps='<p class="small-label" id="compte">'+f.mots.length+' mot'+(f.mots.length>1?'s':'')+' sur 3</p>'+
      '<div class="size-pills mots">'+MOTS.map(m=>'<button type="button" class="size-pill" data-mot="'+esc(m)+'" aria-pressed="'+(f.mots.indexOf(m)>=0)+'">'+esc(m)+'</button>').join('')+'</div>';}
  else if(i===4){dit+=' Complète la phrase. Tu peux toucher une idée.';
    corps=line('lire','Complète la phrase. Tu peux toucher une idée.')+
      '<p class="q-label">Je l’ai choisie parce que…</p>'+
      '<textarea class="saisie" id="champ" rows="3" maxlength="200" aria-label="Pourquoi tu l’as choisie">'+esc(f.pourquoi)+'</textarea>'+
      '<div class="exemples">'+RAISONS.map(r=>'<button type="button" class="size-pill" data-raison="'+esc(r)+'">'+esc(r)+'</button>').join('')+'</div>';}
  else if(i===5){dit+=' Cette étape est facultative.';
    corps=line('lire','Écris une information en plus. Cette étape est facultative.')+
      '<div class="exemples-liste"><p class="small-label">Exemples</p>'+
        '<p><span class="etiq">Taille</span> Il faut mesurer 1 m 20.</p>'+
        '<p><span class="etiq">Hauteur</span> Elle monte à 40 m.</p>'+
        '<p><span class="etiq">Vitesse</span> Elle va à 80 km/h.</p></div>'+
      '<textarea class="saisie" id="champ" rows="2" maxlength="140" aria-label="Information en plus">'+esc(f.plus)+'</textarea>';}
  else{dit+=' Fais ta fiche. Puis présente-la à la classe.';
    corps='<div class="slines">'+line('lire','Ta fiche est presque prête.')+line('photo','Tu peux aussi faire ta présentation sur un tableau blanc : Canva ou Freeform.')+line('etoile','Ajoute une photo de l’attraction et ton texte.')+'</div>'+
      '<div class="tip neutre">'+ICONS.micro+'<div><p>Pour bien présenter :</p><p>1. Je dis le nom du parc et de l’attraction.</p><p>2. Je dis mes 3 mots.</p><p>3. Je dis pourquoi je l’ai choisie.</p><p>4. Je parle fort et je regarde la classe.</p></div></div>';}
  header({segs:[i,n],listen:()=>say(dit)});

    $$('[data-genre]',main).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));maj();}));
  $$('[data-mot]',main).forEach(b=>b.addEventListener('click',()=>{const g=fiche(),m=b.dataset.mot,j=g.mots.indexOf(m);
    if(j>=0)g.mots.splice(j,1);else if(g.mots.length<3)g.mots.push(m);else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}
    garder(g);$$('[data-mot]',main).forEach(x=>x.setAttribute('aria-pressed',String(g.mots.indexOf(x.dataset.mot)>=0)));
    $('#compte').textContent=g.mots.length+' mot'+(g.mots.length>1?'s':'')+' sur 3';maj();}));
  $('#precBtn').addEventListener('click',()=>i?renderProjet(i-1):renderHome());
  suiv.addEventListener('click',()=>{if(e.ok(fiche()))return renderProjet(i+1);

    suiv.classList.remove('shake');void suiv.offsetWidth;suiv.classList.add('shake');});
  maj();
}
function htmlFiche(f){
  const g=GENRES.find(x=>x[0]===f.genre)||GENRES[GENRES.length-1];
  return '<div class="fiche"><div class="fiche-head"><span class="fiche-ico">'+ICONS[g[0]]+'</span><div><p class="small-label">'+esc(f.parc)+' · '+esc(g[1])+'</p><h2 class="fiche-nom">'+esc(f.nom)+'</h2></div></div>'+

    '<p class="fiche-txt">Je l’ai choisie parce que '+esc(f.pourquoi.trim().replace(/^./,c=>c.toLowerCase()))+'</p>'+
    (f.plus.trim()?'<p class="fiche-plus">'+esc(f.plus.trim())+'</p>':'')+'</div>';

function renderFiche(){
  const f=fiche();f.fini=true;garder(f);

  view('<h1>Ma fiche</h1>'+htmlFiche(f)+

    '<div class="actions inline"><button type="button" class="btn" id="nouvBtn">Nouvelle fiche</button><button type="button" class="btn" id="homeBtn2">Accueil</button></div>');
  $('#grandBtn').addEventListener('click',()=>montrerEnGrand(f));
  $('#modifBtn').addEventListener('click',()=>renderProjet(0));

    store('fiche',{});renderProjet(0);});
}
/* Fiche en plein écran pour la présenter au TVI ; on touche n'importe où pour fermer */
function montrerEnGrand(f){
  const o=document.createElement('div');o.className='plein';o.setAttribute('role','dialog');o.setAttribute('aria-label','Ma fiche en grand');
  o.innerHTML='<div class="plein-in">'+htmlFiche(f)+'<p class="small-label">Touche l’écran pour fermer.</p></div>';
  o.addEventListener('click',()=>o.remove());document.body.appendChild(o);
}

/* 7. AIDE PAS-À-PAS */
const H={i:0};
function openHelp(){H.i=0;renderHelp();$('#helpModal').classList.add('on');}
function closeHelp(){$('#helpModal').classList.remove('on');}
function renderHelp(){const n=ETAPES.length,e=ETAPES[H.i];
  $('#helpSegs').innerHTML=ETAPES.map((_,k)=>'<i class="'+(k<=H.i?'on':'')+'"></i>').join('');
  $('#helpBody').innerHTML='<h2>'+esc(e.titre)+'</h2><div class="slines" style="margin-top:14px">'+e.lignes.map(l=>line(l[0],l[1])).join('')+'</div>';
  $('#helpCount').textContent='Étape '+(H.i+1)+' sur '+n;
  $('#helpPrev').style.visibility=H.i?'visible':'hidden';
  $('#helpNext').textContent=H.i===n-1?'J\u2019ai compris':'Suivant';}
function helpGo(d){if(H.i+d>=ETAPES.length)return closeHelp();H.i=Math.max(0,H.i+d);renderHelp();}
$('#helpNext').addEventListener('click',()=>helpGo(1));
$('#helpPrev').addEventListener('click',()=>helpGo(-1));
$('#helpClose').addEventListener('click',closeHelp);
let tx=null;const mb=$('#helpModal .mbox');
mb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
mb.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)helpGo(dx<0?1:-1);});
function layout(){
  const W=innerWidth,H=innerHeight;
  document.body.classList.toggle('portrait',H>W*1.05);
  /* Scrollytelling : tailles d'après la hauteur réelle de la zone qui défile (divisée par le zoom du texte) */
  const visu=$('.sc-visu',main);
  if(visu){
    const z=Number(zoomLevel())||1,mh=main.clientHeight/z,r=document.documentElement.style,portrait=document.body.classList.contains('portrait');
    $('.wrap',main).classList.add('large');
    if(portrait)r.setProperty('--sceneh',Math.round(Math.max(220,Math.min(mh*.36,420)))+'px');
    else r.setProperty('--sceneh',Math.round(Math.min(mh-30,visu.offsetWidth*.95))+'px');
    r.setProperty('--sctop',(portrait?visu.offsetHeight:12)+'px');
    r.setProperty('--scstep',Math.round(mh*1.2)+'px');
    r.setProperty('--scfin',Math.round(mh*.25)+'px');
    if(S.scrolly){S.scrolly.i=-1;scrollyMaj();}
  }
}
let lt=null;const ro=new ResizeObserver(()=>{cancelAnimationFrame(lt);lt=requestAnimationFrame(layout);});
ro.observe(document.body);
addEventListener('orientationchange',()=>setTimeout(layout,250));

ouverture();
renderHome();
})();
</script>
